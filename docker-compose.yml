services:
  db:
    image: postgres:16-alpine
    container_name: mastercota-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mastercota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mastercota}
      POSTGRES_DB: ${POSTGRES_DB:-mastercota}
    volumes:
      - mastercota_pg:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/migrate-pages.sql:/docker-entrypoint-initdb.d/02-pages.sql:ro
      - ./backend/db/migrate-admin.sql:/docker-entrypoint-initdb.d/03-admin.sql:ro
    networks:
      - mastercota_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mastercota}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mastercota-backend:latest
    container_name: mastercota-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-mastercota}:${POSTGRES_PASSWORD:-mastercota}@db:5432/${POSTGRES_DB:-mastercota}
      JWT_SECRET: ${JWT_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      APP_URL: ${NEXT_PUBLIC_APP_URL:-https://mastercota.com}
      OPENWA_BASE_URL: ${OPENWA_BASE_URL:-http://openwa-api:2785}
      OPENWA_API_KEY: ${OPENWA_API_KEY}
      OPENWA_SESSION_ID: ${OPENWA_SESSION_ID}
      OPENWA_ENABLED: ${OPENWA_ENABLED:-true}
      OTP_DEV_CODE: ${OTP_DEV_CODE:-}
      ADMIN_PHONES: ${ADMIN_PHONES:-}
    networks:
      - mastercota_internal
      - openwa_net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:4000/health",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://mastercota.com}
        NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY}
        BACKEND_URL: http://backend:4000
    image: mastercota-web:latest
    container_name: mastercota-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      BACKEND_URL: http://backend:4000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://mastercota.com}
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY}
    networks:
      - traefik_network
      - mastercota_internal
    labels:
      - traefik.enable=true
      - traefik.http.services.mastercota.loadbalancer.server.port=3000
      - traefik.http.routers.mastercota.rule=Host(`mastercota.com`)
      - traefik.http.routers.mastercota.entrypoints=websecure
      - traefik.http.routers.mastercota.tls=true
      - traefik.http.routers.mastercota.tls.certresolver=mytlschallenge
      - traefik.http.routers.mastercota.service=mastercota
      - traefik.http.routers.mastercota-www.rule=Host(`www.mastercota.com`)
      - traefik.http.routers.mastercota-www.entrypoints=websecure
      - traefik.http.routers.mastercota-www.tls=true
      - traefik.http.routers.mastercota-www.tls.certresolver=mytlschallenge
      - traefik.http.routers.mastercota-www.service=mastercota
      - traefik.http.routers.mastercota-www.middlewares=mastercota-www-redirect
      - traefik.http.middlewares.mastercota-www-redirect.redirectregex.regex=^https://www\.mastercota\.com/(.*)
      - traefik.http.middlewares.mastercota-www-redirect.redirectregex.replacement=https://mastercota.com/$${1}
      - traefik.http.middlewares.mastercota-www-redirect.redirectregex.permanent=true
      - traefik.http.routers.mastercota-admin.rule=Host(`admin.mastercota.com`)
      - traefik.http.routers.mastercota-admin.entrypoints=websecure
      - traefik.http.routers.mastercota-admin.tls=true
      - traefik.http.routers.mastercota-admin.tls.certresolver=mytlschallenge
      - traefik.http.routers.mastercota-admin.service=mastercota
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mastercota_pg:

networks:
  traefik_network:
    external: true
  mastercota_internal:
    driver: bridge
  openwa_net:
    external: true
    name: openwa-network
