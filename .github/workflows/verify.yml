name: Verify
on: [push, pull_request]
jobs:
  web-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mastercota_test
          POSTGRES_PASSWORD: mastercota_local_test
          POSTGRES_DB: mastercota_test
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U mastercota_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mastercota_test:mastercota_local_test@127.0.0.1:55432/mastercota_test
      TEST_DATABASE_URL: postgresql://mastercota_test:mastercota_local_test@127.0.0.1:55432/mastercota_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: 'frontend/package-lock.json' }
      - run: npm ci --prefix backend && npm ci --prefix frontend
      - run: npm audit --omit=dev --audit-level=high --prefix backend && npm audit --omit=dev --audit-level=high --prefix frontend
      - run: npm run db:migrate --prefix backend
      - run: npm run db:migrate --prefix backend
      - run: npm run build --prefix backend && npm test --prefix backend
      - run: npm run lint --prefix frontend && npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: browser-failures, path: 'frontend/test-results/' }

  mobile-android:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Build Android release app bundle
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: mastercota-android-unsigned-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  mobile-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Verify Xcode generation
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: flutter pub get
      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign
      - name: Package unsigned iOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app mastercota-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mastercota-ios-unsigned-app
          path: mastercota-ios-unsigned.zip
          if-no-files-found: error
