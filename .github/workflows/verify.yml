name: Verify
on: [push, pull_request]

concurrency:
  group: verify-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  web-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mastercota_test
          POSTGRES_PASSWORD: mastercota_local_test
          POSTGRES_DB: mastercota_test
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U mastercota_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mastercota_test:mastercota_local_test@127.0.0.1:55432/mastercota_test
      TEST_DATABASE_URL: postgresql://mastercota_test:mastercota_local_test@127.0.0.1:55432/mastercota_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: 'frontend/package-lock.json' }
      - run: npm ci --prefix backend && npm ci --prefix frontend
      - run: npm audit --omit=dev --audit-level=high --prefix backend && npm audit --omit=dev --audit-level=high --prefix frontend
      - run: npm run db:migrate --prefix backend
      - run: npm run db:migrate --prefix backend
      - run: npm run build --prefix backend && npm test --prefix backend
      - run: npm run lint --prefix frontend && npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: browser-failures, path: 'frontend/test-results/' }
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://mastercota.com --dart-define=APP_BASE_URL=https://mastercota.com
      - name: Create ephemeral Android release key
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android/app/ci-upload.jks" \
            -storepass ci-mastercota \
            -alias upload \
            -keypass ci-mastercota \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Mastercota CI,O=Mastercota,C=CI"
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/app/ci-upload.jks
          storePassword=ci-mastercota
          keyAlias=upload
          keyPassword=ci-mastercota
          EOF
      - run: flutter build appbundle --release --dart-define=API_BASE_URL=https://mastercota.com --dart-define=APP_BASE_URL=https://mastercota.com

  ios-mobile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://mastercota.com --dart-define=APP_BASE_URL=https://mastercota.com
