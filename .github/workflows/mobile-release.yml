name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plateforme à construire
        required: true
        type: choice
        default: both
        options:
          - both
          - android
          - ios
      version_name:
        description: Version publique (ex. 1.0.0)
        required: true
        default: "1.0.0"
      build_number:
        description: Numéro de build strictement croissant
        required: true
        default: "1"
      upload_to_testing:
        description: Envoyer le build vers Google Play Internal Testing / TestFlight
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    env:
      MASTERCOTA_REQUIRE_SIGNED_RELEASE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Validate Android signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || (echo "ANDROID_KEYSTORE_BASE64 manquant" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD manquant" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS manquant" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD manquant" && exit 1)
      - name: Install Android 16 SDK
        run: "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Install signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/mastercota-upload.jks
          cat > android/key.properties <<EOF
          storeFile=${GITHUB_WORKSPACE}/android/app/mastercota-upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - run: flutter pub get
      - name: Generate app icons
        run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - name: Build signed Play Store bundle
        run: |
          flutter build appbundle --release \
            --build-name="${{ inputs.version_name }}" \
            --build-number="${{ inputs.build_number }}" \
            --obfuscate \
            --split-debug-info=build/symbols/android
      - name: Build signed release APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ inputs.version_name }}" \
            --build-number="${{ inputs.build_number }}" \
            --obfuscate \
            --split-debug-info=build/symbols/android
      - uses: actions/upload-artifact@v4
        with:
          name: mastercota-android-${{ inputs.version_name }}-${{ inputs.build_number }}
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*-release.apk
            build/symbols/android/
          if-no-files-found: error
          retention-days: 30
      - name: Upload to Google Play Internal Testing
        if: inputs.upload_to_testing
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          test -n "$PLAY_JSON" || (echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 manquant" && exit 1)
          echo "$PLAY_JSON" | base64 --decode > "$RUNNER_TEMP/google-play.json"
          gem install fastlane --no-document
          fastlane supply             --aab build/app/outputs/bundle/release/app-release.aab             --package_name app.mastercota.mastercota             --json_key "$RUNNER_TEMP/google-play.json"             --track internal             --release_status completed             --skip_upload_metadata true             --skip_upload_images true             --skip_upload_screenshots true
      - name: Remove signing material
        if: always()
        run: rm -f android/app/mastercota-upload.jks android/key.properties

  ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Validate iOS signing secrets
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERT" || (echo "IOS_DISTRIBUTION_CERTIFICATE_BASE64 manquant" && exit 1)
          test -n "$CERT_PASSWORD" || (echo "IOS_DISTRIBUTION_CERTIFICATE_PASSWORD manquant" && exit 1)
          test -n "$PROFILE" || (echo "IOS_PROVISIONING_PROFILE_BASE64 manquant" && exit 1)
          test -n "$TEAM_ID" || (echo "IOS_TEAM_ID manquant" && exit 1)
          test -n "$PROFILE_NAME" || (echo "IOS_PROVISIONING_PROFILE_NAME manquant" && exit 1)
          test -n "$KEYCHAIN_PASSWORD" || (echo "IOS_KEYCHAIN_PASSWORD manquant" && exit 1)
      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install Apple signing identity
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/mastercota.keychain-db"
          CERT_PATH="$RUNNER_TEMP/mastercota-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/mastercota.mobileprovision"
          echo "$CERT" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
      - name: Configure release team
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          perl -0pi -e "s/DEVELOPMENT_TEAM = [A-Z0-9]+;/DEVELOPMENT_TEAM = $TEAM_ID;/g" ios/Runner.xcodeproj/project.pbxproj
      - name: Create App Store export options
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.mastercota.mastercota</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
      - run: flutter pub get
      - name: Generate app icons
        run: dart run flutter_launcher_icons
      - name: Build signed App Store IPA
        run: |
          flutter build ipa --release \
            --build-name="${{ inputs.version_name }}" \
            --build-number="${{ inputs.build_number }}" \
            --obfuscate \
            --split-debug-info=build/symbols/ios \
            --export-options-plist=ios/ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with:
          name: mastercota-ios-${{ inputs.version_name }}-${{ inputs.build_number }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/*.xcarchive/
            build/symbols/ios/
          if-no-files-found: error
          retention-days: 30
      - name: Upload to App Store Connect / TestFlight
        if: inputs.upload_to_testing
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$ASC_KEY_ID" || (echo "APP_STORE_CONNECT_KEY_ID manquant" && exit 1)
          test -n "$ASC_ISSUER_ID" || (echo "APP_STORE_CONNECT_ISSUER_ID manquant" && exit 1)
          test -n "$ASC_PRIVATE_KEY" || (echo "APP_STORE_CONNECT_PRIVATE_KEY_BASE64 manquant" && exit 1)
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_PRIVATE_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(find build/ios/ipa -name '*.ipa' -print -quit)
          test -n "$IPA" || (echo "IPA introuvable" && exit 1)
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove signing material
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          rm -f ios/ExportOptions.plist
          rm -rf "$HOME/.appstoreconnect/private_keys"
          security delete-keychain "$RUNNER_TEMP/mastercota.keychain-db" || true
